name: Build and test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore packages
        run: dotnet restore AcxiomCRM.sln

      # Build (warnings as errors) → 65 unit tests → start the app → API checks → security checks.
      - name: Run every check
        run: bash tests/run_all_checks.sh
